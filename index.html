<body>
<div class="container">
  <div class="header">
    <h1>🔬 ESE N-Lens — Interactive</h1>
    <p class="subtitle">
      Monte Carlo ray shooting · N gaussian lenses · α ∝ ν⁻², σ_source ∝ ν⁻¹<br>
      <small>Config A: all z = 0 · Config B: z₂ > 0 (меняется слайдером z у линзы 2+)</small>
    </p>
  </div>

  <div class="plots">
    <div id="rayDiv" class="plot-card"></div>
    <div id="lcDiv" class="plot-card"></div>
  </div>

  <div class="controls">
    <h2>Общие параметры</h2>

    <div class="checkbox-row">
      <label>
        <input type="checkbox" id="showEnsemble" checked>
        Показывать ансамбль лучей (σ_source)
        <span class="hint">— оранжевые лучи с реальным разбросом источника</span>

    </div>

    <div class="grid">
      <div class="slider-group">
        <label>sigma_source <span class="val" id="sigma-v">1.00</span></label>

        <input type="range" id="umin" min="-60" max="-1" step="1" value="-20">
      </div>
      <div class="slider-group">
        <label>u_plot_max <span class="val" id="umax-v">25</span></label>
        <input type="range" id="umax" min="1" max="60" step="1" value="25">
      </div>
      <div class="slider-group">
        <label>noise_level <span class="val" id="noise-v">0.05</span></label>
        <input type="range" id="noise" min="0" max="0.3" step="0.01" value="0.05">
      </div>
      <div class="slider-group">
        <label>v (скорость) <span class="val" id="v-v">0.50</span></label>

  <div class="lenses-panel">

      Линзы <span style="font-weight:400;color:#7f8c8d;font-size:0.85em" id="nLenses">(2)</span>
      <button class="btn-add" id="addLens">+ Добавить линзу</button>
    </h2>
    <div id="lensesContainer"></div>

<script>
// ============================================================
// КОНСТАНТЫ МОДЕЛИ (как в Python)
// ============================================================
const NU_REF = 1.0;
const NU     = 1.0;    // одна частота
const T_MAX  = 60.0;
const NUM_POINTS = 40;
const RANDOM_SEED = 42;

const NUM_BETA = 4000;   // оптимизация под браузер (в Python 10000)
const NUM_U    = 600;    // (в Python 1000)
const NUM_BINS = 200;

const RAY_SEED = 777;
const LENS_COLORS = ['#2c7be5', '#27ae60', '#e67e22', '#8e44ad', '#c0392b', '#16a085'];

// ============================================================
// УТИЛИТЫ
// ============================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gaussian(rng, sigma) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function linspace(a, b, n) {
  const arr = new Array(n);
  if (n === 1) { arr[0] = a; return arr; }
  const step = (b - a) / (n - 1);
  for (let i = 0; i < n; i++) arr[i] = a + i * step;
  return arr;
}
function autoURange(lenses, sigmaEff, nuRef, nu, nSigma = 5) {
  const alphaScale = Math.pow(nuRef / nu, 2);
  let alphaMax = 0;
  for (const l of lenses) alphaMax = Math.max(alphaMax, l.alpha);
  alphaMax *= alphaScale;
  const uMax = 0.43 * alphaMax + nSigma * sigmaEff + 5.0;
  return [-uMax, uMax];
}

// ============================================================
// ЯДРО: compute_ese_multi (точный порт Python)
// ============================================================
function computeEseMulti(lenses, sigmaSource, nu, nuRef,
                         uRange, uPrimeRange,
                         numBeta, numU, numBins, rng) {
  const alphaScale = Math.pow(nuRef / nu, 2);
  const sigmaEff   = sigmaSource * Math.pow(nuRef / nu, 1);

  // Копия + сортировка по z
  let lensesSorted = lenses.map(l => ({...l})).sort((a, b) => a.z - b.z);

  // Если первая не в 0 — сдвигаем всё
  if (Math.abs(lensesSorted[0].z) > 1e-12) {
    const zShift = lensesSorted[0].z;
    lensesSorted.forEach(l => l.z -= zShift);
  }

  if (!uRange) uRange = autoURange(lensesSorted, sigmaEff, nuRef, nu);
  if (!uPrimeRange) uPrimeRange = uRange;

  const u0 = linspace(uRange[0], uRange[1], numU);

  // Плоские массивы (numBeta * numU)
  const N = numBeta * numU;
  const uCurrent  = new Float64Array(N);
  const totalDefl = new Float64Array(N);

  // Инициализация: u0 повторяется numBeta раз
  for (let k = 0; k < numBeta; k++) {
    const off = k * numU;
    for (let i = 0; i < numU; i++) uCurrent[off + i] = u0[i];
  }

  let zPrev = 0.0;
  for (const lens of lensesSorted) {
    const dz = lens.z - zPrev;
    if (dz > 0) {
      for (let idx = 0; idx < N; idx++) {
        uCurrent[idx] += totalDefl[idx] * dz;
      }
    }
    const alphaI   = lens.alpha * alphaScale;
    const uOffI    = lens.u_offset;
    const aRatioI  = lens.a_ratio || 1.0;
    const alphaEff = alphaI / (aRatioI * aRatioI);
    const gaussI   = 1.0 / (aRatioI * aRatioI);

    for (let idx = 0; idx < N; idx++) {
      const uShift = uCurrent[idx] - uOffI;
      const defI = alphaEff * uShift * Math.exp(-gaussI * uShift * uShift);
      totalDefl[idx] += defI;
    }
    zPrev = lens.z;
  }

  const dzFinal = 1.0 - zPrev;

  // Гистограммы
  const bins = linspace(uPrimeRange[0], uPrimeRange[1], numBins + 1);
  const binW = bins[1] - bins[0];
  const histLensed   = new Float64Array(numBins);
  const histUnlensed = new Float64Array(numBins);

  for (let k = 0; k < numBeta; k++) {
    const betaS = gaussian(rng, sigmaEff);
    const off = k * numU;
    for (let i = 0; i < numU; i++) {
      const idx = off + i;
      const upL = uCurrent[idx] + totalDefl[idx] * dzFinal + betaS;
      const upU = u0[i] + betaS;

      let idxL = Math.floor((upL - bins[0]) / binW);
      if (idxL >= 0 && idxL < numBins) histLensed[idxL]++;

      let idxU = Math.floor((upU - bins[0]) / binW);
      if (idxU >= 0 && idxU < numBins) histUnlensed[idxU]++;
    }
  }

  const norm = numBeta * numU * binW;
  const binCenters = new Array(numBins);
  const intensity  = new Array(numBins);
  for (let i = 0; i < numBins; i++) {
    binCenters[i] = (bins[i] + bins[i + 1]) / 2;
    const hU = histUnlensed[i] / norm;
    const hL = histLensed[i]   / norm;
    intensity[i] = hU > 0 ? hL / hU : 0;
  }

  let energy = 0;
  for (let i = 0; i < numBins; i++) energy += intensity[i] * binW;

  return { binCenters, intensity, energy };
}

// ============================================================
// ТРАССИРОВКА ЛУЧЕЙ ДЛЯ ДИАГРАММЫ (последовательная)
// ============================================================
function traceRays(lensesSorted, uLensArray, alphaScale, useEnsemble, sigmaSource, rng) {
  const numRays = uLensArray.length;
  const zSource = -1.0;
  const zObs = 1.0;

  // Начальные позиции в плоскости источника
  const uStart = new Float64Array(numRays);
  for (let k = 0; k < numRays; k++) {
    const betaS = useEnsemble ? gaussian(rng, sigmaSource) : 0.0;
    uStart[k] = uLensArray[k] + betaS;
  }

  // История: массив {z1, z2, u1, u2} — сегменты между последовательными плоскостями
  const segments = [];

  let uCurrent  = Float64Array.from(uStart);
  let totalDefl = new Float64Array(numRays);
  let zPrev = 0.0;

  // Начальный сегмент: от плоскости источника (z = -1) до первой линзы (z = 0)
  // На этом участке totalDefl = 0, так что u не меняется
  segments.push({
    z1: zSource, z2: 0.0,
    u1: Float64Array.from(uCurrent),
    u2: Float64Array.from(uCurrent)
  });

  for (let i = 0; i < lensesSorted.length; i++) {
    const lens = lensesSorted[i];
    const dz = lens.z - zPrev;

    // Пролёт от zPrev до z_i (если dz > 0)
    if (dz > 0) {
      const uAtLens = new Float64Array(numRays);
      for (let k = 0; k < numRays; k++) {
        uAtLens[k] = uCurrent[k] + totalDefl[k] * dz;
      }
      segments.push({
        z1: zPrev, z2: lens.z,
        u1: Float64Array.from(uCurrent),
        u2: Float64Array.from(uAtLens)
      });
      uCurrent = uAtLens;
    }

    // Отклонение от линзы i
    const alphaI   = lens.alpha * alphaScale;
    const uOffI    = lens.u_offset;
    const aRatioI  = lens.a_ratio || 1.0;
    const alphaEff = alphaI / (aRatioI * aRatioI);
    const gaussI   = 1.0 / (aRatioI * aRatioI);

    for (let k = 0; k < numRays; k++) {
      const uShift = uCurrent[k] - uOffI;
      const defI = alphaEff * uShift * Math.exp(-gaussI * uShift * uShift);
      totalDefl[k] += defI;
    }

    zPrev = lens.z;
  }

  // Финальный полёт до наблюдателя
  const dzFinal = zObs - zPrev;
  const uObs = new Float64Array(numRays);
  for (let k = 0; k < numRays; k++) {
    uObs[k] = uCurrent[k] + totalDefl[k] * dzFinal;
  }
  segments.push({
    z1: zPrev, z2: zObs,
    u1: Float64Array.from(uCurrent),
    u2: Float64Array.from(uObs)
  });

  return { segments };
}

// ============================================================
// ДИАГРАММА ЛУЧЕЙ
// ============================================================
function buildRayTraces(lenses, sigmaSource, nu, nuRef, numRays,
                        uPlotMin, uPlotMax, binCenters, intensity,
                        showEnsemble) {
  const zObs = 1.0;
  const bulgeAmp = 0.05;
  const alphaScale = Math.pow(nuRef / nu, 2);

  // Копия + сортировка
  let lensesSorted = lenses.map(l => ({...l})).sort((a, b) => a.z - b.z);
  if (Math.abs(lensesSorted[0].z) > 1e-12) {
    const zShift = lensesSorted[0].z;
    lensesSorted.forEach(l => l.z -= zShift);
  }

  // Сетка для контуров линз
  const nPlot = 400;
  const uPlot = linspace(uPlotMin, uPlotMax, nPlot);

  const traces = [];

  // ---- Слой 1: оранжевый ансамбль (опционально) ----
  if (showEnsemble) {
    const rng = mulberry32(RAY_SEED);
    const uLensArray = linspace(uPlotMin, uPlotMax, numRays);
    const { segments } = traceRays(lensesSorted, uLensArray, alphaScale,
                                   true, sigmaSource, rng);

    // Один трейс на сегмент, чтобы не плодить миллионы трейсов
    for (const seg of segments) {
      const xArr = [], yArr = [];
      for (let k = 0; k < numRays; k++) {
        xArr.push(seg.u1[k], seg.u2[k], null);
        yArr.push(seg.z1, seg.z2, null);
      }
      traces.push({
        x: xArr, y: yArr, type: 'scatter', mode: 'lines',
        line: { color: 'rgba(255,140,0,0.30)', width: 1 },
        hoverinfo: 'skip', showlegend: false
      });
    }
  }

  // ---- Слой 2: чёрный скелет (beta_s = 0) ----
  {
    const rng = mulberry32(RAY_SEED);   // не используется по существу, но нужен
    const uLensArray = linspace(uPlotMin, uPlotMax, numRays);
    const { segments } = traceRays(lensesSorted, uLensArray, alphaScale,
                                   false, 0.0, rng);

    for (const seg of segments) {
      const xArr = [], yArr = [];
      for (let k = 0; k < numRays; k++) {
        xArr.push(seg.u1[k], seg.u2[k], null);
        yArr.push(seg.z1, seg.z2, null);
      }
      traces.push({
        x: xArr, y: yArr, type: 'scatter', mode: 'lines',
        line: { color: 'black', width: 0.7 },
        opacity: 0.7, hoverinfo: 'skip', showlegend: false
      });
    }
  }

  // ---- Линзы ----
  for (let i = 0; i < lensesSorted.length; i++) {
    const lens = lensesSorted[i];
    const aRatioI = lens.a_ratio || 1.0;
    const gaussI = 1.0 / (aRatioI * aRatioI);
    const bulge = new Float64Array(nPlot);
    for (let k = 0; k < nPlot; k++) {
      const du = uPlot[k] - lens.u_offset;
      bulge[k] = bulgeAmp * Math.exp(-gaussI * du * du);
    }
    const color = LENS_COLORS[i % LENS_COLORS.length];
    const yTop = uPlot.map((_, k) => lens.z - bulge[k]);
    const yBot = uPlot.map((_, k) => lens.z + bulge[k]);

    traces.push({
      x: uPlot.concat([...uPlot].reverse()),
      y: yTop.concat([...yBot].reverse()),
      type: 'scatter', mode: 'lines',
      fill: 'toself', fillcolor: color + '66',
      line: { color: color, width: 1 },
      name: `Lens ${i + 1} (z=${lens.z.toFixed(2)}, α=${lens.alpha})`,
      hoverinfo: 'skip'
    });
  }

  // ---- Плоскость наблюдателя ----
  traces.push({
    x: [uPlotMin, uPlotMax], y: [zObs, zObs],
    type: 'scatter', mode: 'lines',
    line: { color: 'red', dash: 'dot', width: 3 },
    name: 'Observer'
  });

  // ---- Кривая блеска (отражённая) ----
  if (binCenters && intensity) {
    const xLC = [], yLC = [];
    for (let i = 0; i < binCenters.length; i++) {
      if (binCenters[i] < uPlotMin || binCenters[i] > uPlotMax) continue;
      xLC.push(binCenters[i]);
      yLC.push(-0.1 * (intensity[i] - 1) + zObs);
    }
    traces.push({
      x: xLC, y: yLC, type: 'scatter', mode: 'lines',
      line: { color: '#1f77b4', width: 3 },
      name: 'Light curve (ν_ref)', hoverinfo: 'skip'
    });
  }

  return traces;
}

// ============================================================
// КРИВАЯ БЛЕСКА (одна частота + шумовые точки)
// ============================================================
function buildLightCurveTraces(result, xlimU, v, uPrime0, noiseLevel) {
  const traces = [];

  traces.push({
    x: result.binCenters, y: result.intensity,
    type: 'scatter', mode: 'lines',
    line: { color: 'blue', width: 2 },
    name: 'Model ν = ν_ref'
  });

  traces.push({
    x: [xlimU[0], xlimU[1]], y: [1, 1],
    type: 'scatter', mode: 'lines',
    line: { color: 'gray', dash: 'dash', width: 1 },
    name: 'Unlensed'
  });

  // Шумовые точки по опорной частоте
  const bcRef = result.binCenters;
  const IRef  = result.intensity;

  const rng = mulberry32(RANDOM_SEED);
  const tPoints = linspace(0, T_MAX, NUM_POINTS);
  const upPoints = tPoints.map(t => uPrime0 + v * t);

  const xObs = [], yObs = [], yErr = [];
  for (let k = 0; k < NUM_POINTS; k++) {
    const up = upPoints[k];
    if (up < xlimU[0] || up > xlimU[1]) continue;
    let iModel = 0;
    for (let j = 0; j < bcRef.length - 1; j++) {
      if (up >= bcRef[j] && up <= bcRef[j + 1]) {
        const frac = (up - bcRef[j]) / (bcRef[j + 1] - bcRef[j]);
        iModel = IRef[j] * (1 - frac) + IRef[j + 1] * frac;
        break;
      }
    }
    const noise = gaussian(rng, noiseLevel);
    xObs.push(up);
    yObs.push(iModel + noise);
    yErr.push(noiseLevel);
  }

  traces.push({
    x: xObs, y: yObs,
    error_y: { type: 'data', array: yErr, visible: true, thickness: 0.8 },
    type: 'scatter', mode: 'markers',
    marker: { color: 'black', size: 5 },
    name: 'Simulated data'
  });

  return traces;
}

// ============================================================
// СОСТОЯНИЕ ЛИНЗ
// ============================================================
let lenses = [
  { alpha: 15, u_offset: 0,  z: 0.0, a_ratio: 1.0 },
  { alpha: 10, u_offset: 10, z: 0.0, a_ratio: 1.3 }
];

function renderLenses() {
  const container = document.getElementById('lensesContainer');
  container.innerHTML = '';
  document.getElementById('nLenses').textContent = `(${lenses.length})`;

  lenses.forEach((lens, i) => {
    const isFirst = (i === 0);
    const color = LENS_COLORS[i % LENS_COLORS.length];

    const card = document.createElement('div');
    card.className = 'lens-card';

    const header = document.createElement('h3');
    header.style.borderLeft = `3px solid ${color}`;
    header.textContent = `Линза ${i + 1}`;
    card.appendChild(header);

    // Кнопка удаления
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-del';
    delBtn.textContent = '×';
    delBtn.disabled = (lenses.length <= 1);
    delBtn.addEventListener('click', () => {
      lenses.splice(i, 1);
      // Первая линза всегда должна иметь z=0
      if (lenses.length > 0) lenses[0].z = 0;
      renderLenses();
      update();
    });
    card.appendChild(delBtn);

    const grid = document.createElement('div');
    grid.className = 'lens-grid';

    // Хелпер для создания слайдера
    function addSlider(key, labelText, min, max, step, disabled = false, fmt = v => v.toFixed(1)) {
      const group = document.createElement('div');
      group.className = 'slider-group';

      const label = document.createElement('label');
      label.textContent = labelText;

      const val = document.createElement('span');
      val.className = 'val';
      val.textContent = fmt(lens[key]);
      label.appendChild(val);

      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = step;
      input.value = lens[key];
      input.disabled = disabled;

      input.addEventListener('input', e => {
        lens[key] = parseFloat(e.target.value);
        val.textContent = fmt(lens[key]);
        update();
      });

      group.appendChild(label);
      group.appendChild(input);
      grid.appendChild(group);
    }

    // alpha, u_offset, z, a_ratio
    addSlider('alpha',    'alpha',     1, 50, 0.5);
    addSlider('u_offset', 'u_offset', -20, 20, 0.5);
    addSlider('z', 'z' + (isFirst ? ' (fixed = 0)' : ''),
              0, 0.9, 0.05, isFirst, v => v.toFixed(2));

    // a_ratio — только для 2+ линзы
    if (!isFirst) {
      addSlider('a_ratio', 'a_ratio', 0.5, 3, 0.05, false, v => v.toFixed(2));
    }

    card.appendChild(grid);
    container.appendChild(card);
  });
}

// ============================================================
// ПЕРЕРИСОВКА
// ============================================================
let busy = false;

function update() {
  if (busy) return;
  busy = true;
  const t0 = performance.now();

  const sigma      = +document.getElementById('sigma').value;
  const numRays    = +document.getElementById('nrays').value;
  const uPlotMin   = +document.getElementById('umin').value;
  const uPlotMax   = +document.getElementById('umax').value;
  const noiseLevel = +document.getElementById('noise').value;
  const v          = +document.getElementById('v').value;
  const showEns    = document.getElementById('showEnsemble').checked;

  document.getElementById('sigma-v').textContent = sigma.toFixed(2);
  document.getElementById('nrays-v').textContent = numRays;
  document.getElementById('umin-v').textContent  = uPlotMin;
  document.getElementById('umax-v').textContent  = uPlotMax;
  document.getElementById('noise-v').textContent = noiseLevel.toFixed(2);
  document.getElementById('v-v').textContent     = v.toFixed(2);

  if (uPlotMin >= uPlotMax) {
    document.getElementById('status').textContent =
      '⚠ u_plot_min должен быть меньше u_plot_max';
    document.getElementById('status').className = 'status warn';
    busy = false;
    return;
  }

  // Первая линза всегда z = 0
  if (lenses.length > 0) lenses[0].z = 0;

  // Расчёт кривой блеска
  const rng = mulberry32(12345);
  const alphaScale = Math.pow(NU_REF / NU, 2);
  const sigmaEff = sigma * Math.pow(NU_REF / NU, 1);

  // Общий диапазон u
  const lensesSorted = lenses.map(l => ({...l})).sort((a, b) => a.z - b.z);
  const uRangeCommon = autoURange(lensesSorted, sigmaEff, NU_REF, NU);

  const result = computeEseMulti(
    lenses, sigma, NU, NU_REF,
    uRangeCommon, uRangeCommon,
    NUM_BETA, NUM_U, NUM_BINS, rng
  );

  // Диапазон x для кривой блеска
  const xlimU = [uPlotMin, uPlotMax];
  const uPrime0 = -v * T_MAX / 2.0;

  // --- Диаграмма лучей ---
  const rayTraces = buildRayTraces(
    lenses, sigma, NU, NU_REF, numRays,
    uPlotMin, uPlotMax,
    result.binCenters, result.intensity,
    showEns
  );

  const rayLayout = {
    title: {
      text: `Ray Diagram · ${lenses.length} lens(es) · σ=${sigma.toFixed(2)}`,
      font: { size: 13 }
    },
    xaxis: {
      title: "u' (in lens units)",
      range: [uPlotMin, uPlotMax],
      zeroline: false
    },
    yaxis: {
      title: "Lens-observer distance (D)",
      range: [1.2, -0.15],
      zeroline: false
    },
    margin: { l: 60, r: 20, t: 50, b: 50 },
    legend: { x: 1, xanchor: 'right', y: 1, bgcolor: 'rgba(255,255,255,0.85)' },
    plot_bgcolor: 'white'
  };

  // --- Кривая блеска ---
  const lcTraces = buildLightCurveTraces(result, xlimU, v, uPrime0, noiseLevel);
  const lcLayout = {
    title: { text: 'Light curve · ν = ν_ref', font: { size: 13 } },
    xaxis: { title: "u' (in lens units)", range: xlimU, zeroline: false },
    yaxis: { title: "Normalized Intensity", zeroline: false },
    margin: { l: 60, r: 20, t: 50, b: 50 },
    legend: { x: 1, xanchor: 'right', y: 1, bgcolor: 'rgba(255,255,255,0.85)' },
    plot_bgcolor: 'white'
  };

  Plotly.react('rayDiv', rayTraces, rayLayout, { responsive: true, displaylogo: false });
  Plotly.react('lcDiv',  lcTraces,  lcLayout,  { responsive: true, displaylogo: false });

  const dt = (performance.now() - t0).toFixed(0);
  const statusEl = document.getElementById('status');
  const ensState = showEns ? 'ансамбль: вкл' : 'ансамбль: выкл';
  if (Math.abs(result.energy - 1) > 0.1) {
    statusEl.textContent =
      `⚠ energy = ${result.energy.toFixed(3)} (ожидалось ≈ 1.0) · ` +
      `${ensState} · пересчёт: ${dt} ms`;
    statusEl.className = 'status warn';
  } else {
    statusEl.textContent =
      `✓ Пересчёт: ${dt} ms · energy = ${result.energy.toFixed(3)} · ` +
      `${ensState} · N_beta=${NUM_BETA}, N_u=${NUM_U}, N_bins=${NUM_BINS}`;
    statusEl.className = 'status';
  }

  busy = false;
}

// ============================================================
// ПОДПИСКИ
// ============================================================
['sigma', 'nrays', 'umin', 'umax', 'noise', 'v'].forEach(id => {
  document.getElementById(id).addEventListener('input', update);
});
document.getElementById('showEnsemble').addEventListener('change', update);

document.getElementById('addLens').addEventListener('click', () => {
  const i = lenses.length;
  lenses.push({
    alpha: 10,
    u_offset: (i % 2 === 0) ? 0 : 10,
    z: 0.0,
    a_ratio: 1.0
  });
  renderLenses();
  update();
});

// Первый запуск
renderLenses();
update();
</script>
